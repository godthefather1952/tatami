[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionforge"
version = "0.1.0"
description = "Local CPU-compatible image+prompt to video generation for GitHub Codespaces"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.6,<2.11",
  "torchvision>=0.21,<0.26",
  "diffusers>=0.36,<0.38",
  "transformers>=4.48,<5",
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
  "huggingface_hub>=0.27,<2",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "imageio>=2.35,<3",
  "imageio-ffmpeg>=0.5,<1",
  "gradio>=5,<7",
  "psutil>=6,<8",
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
motionforge = "motionforge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
